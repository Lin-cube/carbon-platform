server {
    listen 80;
    server_name YOUR_DOMAIN.COM;          # ← 换成你的域名

    # 前端静态文件目录（部署脚本会放到这里）
    root /opt/carbon-platform/dist;
    index index.html;

    # 上传上限：后端允许 100MB（application.yml 的 max-file-size）
    # nginx 必须 >= 后端限制，否则大文件会在 nginx 层被 413 拦掉
    client_max_body_size 100m;

    # ---------------- 压缩 ----------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # ---------------- 静态资源长缓存 ----------------
    # Vite 构建产物带内容哈希，可以安全地长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------------- 后端 API ----------------
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 问答会调 DeepSeek，实测 2.0~3.2s；异常诊断可能更久。
        # 默认 60s 够用，这里放宽到 120s 避免长请求被切断。
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 关闭缓冲，让流式响应（若有）能及时到达浏览器
        proxy_buffering off;
    }

    # ---------------- 前端路由（history 模式）----------------
    # Vue Router 用 history 模式，刷新 /dashboard 这类路径时要回落到 index.html，
    # 否则会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------------- 安全响应头 ----------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---------------- 禁止访问隐藏文件 ----------------
    location ~ /\. {
        deny all;
    }
}
